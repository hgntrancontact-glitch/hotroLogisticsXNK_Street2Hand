<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S2H AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;font-family:'Inter',sans-serif;background:#FFFFFF;color:#0D0D0D;}
  ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.08);border-radius:4px;}

  /* ── Layout ── */
  #app{display:flex;flex-direction:column;height:100vh;max-width:760px;margin:0 auto;}

  /* ── Header ── */
  #header{padding:16px 20px;border-bottom:1px solid #F0F0F0;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  #brand-logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#00B89C,#6A5BDF);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #brand-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:#111;}
  #header-sub{font-size:12px;color:#9CA3AF;margin-top:1px;}
  .online-dot{width:7px;height:7px;border-radius:50%;background:#22C55E;margin-left:auto;flex-shrink:0;}

  /* ── Messages ── */
  #messages{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:20px;}

  /* Welcome bubble */
  .welcome-bubble{background:#F8F8F8;border:1px solid #EDEDED;border-radius:4px 16px 16px 16px;padding:16px 18px;max-width:100%;font-size:14px;line-height:1.7;color:#374151;white-space:pre-wrap;}

  /* User message */
  .msg-user-wrap{display:flex;justify-content:flex-end;}
  .msg-user{background:#111;color:#fff;border-radius:18px 18px 4px 18px;padding:11px 16px;max-width:75%;font-size:14px;line-height:1.6;word-break:break-word;}

  /* AI message */
  .msg-ai-wrap{display:flex;gap:10px;align-items:flex-start;}
  .ai-avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#00B89C,#6A5BDF);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .msg-ai{font-size:14px;line-height:1.75;color:#111;flex:1;min-width:0;}

  /* Prose */
  .msg-ai h1,.msg-ai h2,.msg-ai h3{font-family:'Space Grotesk',sans-serif;font-weight:600;margin:1em 0 0.35em;}
  .msg-ai h1{font-size:16px;} .msg-ai h2{font-size:15px;} .msg-ai h3{font-size:14px;color:#374151;}
  .msg-ai p{margin:0.45em 0;}
  .msg-ai ul,.msg-ai ol{padding-left:1.3em;margin:0.4em 0;}
  .msg-ai li{margin:0.2em 0;}
  .msg-ai strong{font-weight:600;color:#000;}
  .msg-ai code{font-family:'SF Mono',monospace;background:#F3F4F6;color:#111;padding:1px 6px;border-radius:5px;font-size:12.5px;}
  .msg-ai pre{background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:14px;overflow-x:auto;margin:0.6em 0;}
  .msg-ai pre code{background:none;font-size:12px;}
  .msg-ai table{width:100%;border-collapse:collapse;margin:0.6em 0;font-size:13px;}
  .msg-ai th{background:#F3F4F6;padding:8px 12px;text-align:left;border:1px solid #E5E7EB;font-weight:600;}
  .msg-ai td{padding:7px 12px;border:1px solid #E5E7EB;}
  .msg-ai tr:nth-child(even) td{background:#FAFAFA;}
  .msg-ai blockquote{border-left:3px solid #D1D5DB;padding-left:12px;color:#6B7280;margin:0.5em 0;font-style:italic;}
  .msg-ai a{color:#00B89C;text-decoration:underline;}

  /* Loading */
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  .typing-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#9CA3AF;animation:blink 1.4s infinite;}
  .typing-dot:nth-child(2){animation-delay:.2s;} .typing-dot:nth-child(3){animation-delay:.4s;}

  /* ── Input ── */
  #input-area{padding:12px 20px 20px;flex-shrink:0;}
  #input-wrap{display:flex;align-items:flex-end;gap:8px;background:#F9F9F9;border:1.5px solid #E5E7EB;border-radius:16px;padding:6px 6px 6px 14px;transition:border-color 0.2s,box-shadow 0.2s;}
  #input-wrap:focus-within{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,0.06);}
  #msg-input{flex:1;background:transparent;border:none;outline:none;resize:none;font-family:'Inter',sans-serif;font-size:14px;color:#111;line-height:1.5;max-height:160px;min-height:36px;padding:6px 0;}
  #msg-input::placeholder{color:#9CA3AF;}
  .attach-btn{flex-shrink:0;width:34px;height:34px;border:none;background:transparent;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9CA3AF;transition:all 0.15s;}
  .attach-btn:hover{background:#F0F0F0;color:#374151;}
  #send-btn{flex-shrink:0;width:34px;height:34px;border-radius:10px;border:none;background:#111;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
  #send-btn:hover{background:#333;}
  #send-btn:disabled{background:#E5E7EB;cursor:not-allowed;}

  /* Image preview */
  #img-preview-bar{display:none;padding:8px 0 0;}
  #img-preview-inner{display:inline-flex;align-items:center;gap:8px;background:#F3F4F6;border:1px solid #E5E7EB;border-radius:10px;padding:6px 10px;}
  #img-preview-thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;}
  .remove-img-btn{background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:16px;line-height:1;padding:0 2px;}
  .remove-img-btn:hover{color:#374151;}

  /* Footer hint */
  #footer-hint{text-align:center;font-size:11px;color:#D1D5DB;padding-bottom:8px;padding-top:4px;}

  /* Not configured banner */
  #not-configured{display:none;margin:16px 20px;background:#FFF9EC;border:1px solid #FDE68A;border-radius:12px;padding:14px 18px;font-size:13px;color:#92400E;line-height:1.5;}

  /* Fade in */
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .fade-up{animation:fadeUp 0.25s ease;}

  /* Mobile */
  @media(max-width:600px){
    #app{max-width:100%;}
    .msg-user{max-width:85%;}
    #messages{padding:16px 14px;}
    #input-area{padding:10px 14px 16px;}
  }

  /* Error state */
  .msg-error{background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:10px 14px;font-size:13px;color:#991B1B;}
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div id="brand-logo">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M3 1.5h12l2.5 2.5v10.5l-2.5 2.5H3L0.5 14.5V4L3 1.5Z" stroke="white" stroke-width="1" fill="rgba(255,255,255,0.2)"/>
        <path d="M5 6.5h8M5 9h5.5M5 11.5h4" stroke="white" stroke-width="1" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div id="brand-title">Street 2 Hand AI</div>
      <div id="header-sub">Trợ lý học tập XNK & Logistics</div>
    </div>
    <div class="online-dot" id="status-dot"></div>
  </div>

  <!-- Not configured warning -->
  <div id="not-configured">
    ⚙️ <strong>Chatbot chưa được cấu hình.</strong> Vui lòng mở <code>admin.html</code> để thiết lập API Key và nội dung trước.
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Input -->
  <div id="input-area">
    <div id="img-preview-bar">
      <div id="img-preview-inner">
        <img id="img-thumb" src="" alt="">
        <span style="font-size:12px;color:#6B7280;">Ảnh đính kèm</span>
        <button class="remove-img-btn" onclick="removeImg()">×</button>
      </div>
    </div>
    <div id="input-wrap">
      <button class="attach-btn" onclick="document.getElementById('file-inp').click()" title="Đính kèm ảnh">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </button>
      <input type="file" id="file-inp" accept="image/*" class="hidden" onchange="handleFile(event)">
      <textarea id="msg-input" rows="1" placeholder="Nhập câu hỏi... hoặc Ctrl+V dán ảnh"
        onkeydown="onKey(event)" oninput="resize(this)" onpaste="onPaste(event)"></textarea>
      <button id="send-btn" onclick="send()" title="Gửi">
        <svg width="16" height="16" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div id="footer-hint">Enter gửi · Shift+Enter xuống dòng · Ctrl+V dán ảnh</div>
  </div>

</div>

<script>
// ══════════════════════════════════════
// CONFIG FROM ADMIN
// ══════════════════════════════════════
function getConfig() {
  try { return JSON.parse(localStorage.getItem('s2h_admin_config') || '{}'); } catch { return {}; }
}

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let pendingImg = null; // {base64, mimeType, dataUrl}
let isLoading = false;
let rateLocked = false;
let chatHistory = []; // [{role, parts}] for Gemini

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  const cfg = getConfig();

  // Brand
  if (cfg.brandName) {
    document.getElementById('brand-title').textContent = cfg.brandName;
    document.title = cfg.brandName;
  }

  // Check config
  if (!cfg.apiKey) {
    document.getElementById('not-configured').style.display = 'block';
    document.getElementById('status-dot').style.background = '#F59E0B';
    document.getElementById('msg-input').disabled = true;
    document.getElementById('send-btn').disabled = true;
  }

  // Welcome message
  const welcomeText = cfg.welcomeMsg || '👋 Xin chào! Tôi là Trợ lý AI của Street 2 Hand. Hãy đặt câu hỏi về XNK & Logistics nhé!';
  appendWelcome(welcomeText);

  document.getElementById('msg-input').focus();
});

// ══════════════════════════════════════
// WELCOME
// ══════════════════════════════════════
function appendWelcome(text) {
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-ai-wrap fade-up';
  wrap.innerHTML = `
    <div class="ai-avatar">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 1h10l2 2v8l-2 2H2L0 11V3L2 1Z" stroke="white" stroke-width="0.8" fill="rgba(255,255,255,0.2)"/></svg>
    </div>
    <div class="welcome-bubble">${escHtml(text)}</div>`;
  box.appendChild(wrap);
}

// ══════════════════════════════════════
// IMAGE HANDLING
// ══════════════════════════════════════
function onPaste(e) {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      processImageFile(item.getAsFile());
      return;
    }
  }
}
function handleFile(e) {
  const f = e.target.files[0];
  if (f) processImageFile(f);
  e.target.value = '';
}
function processImageFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    pendingImg = { base64: dataUrl.split(',')[1], mimeType: file.type || 'image/jpeg', dataUrl };
    document.getElementById('img-thumb').src = dataUrl;
    document.getElementById('img-preview-bar').style.display = 'block';
  };
  reader.readAsDataURL(file);
}
function removeImg() {
  pendingImg = null;
  document.getElementById('img-preview-bar').style.display = 'none';
  document.getElementById('img-thumb').src = '';
}

// ══════════════════════════════════════
// INPUT
// ══════════════════════════════════════
function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}
function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

// ══════════════════════════════════════
// SEND
// ══════════════════════════════════════
async function send() {
  if (isLoading || rateLocked) return;
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  if (!text && !pendingImg) return;

  const cfg = getConfig();
  if (!cfg.apiKey) return;

  // Rate lock 3s
  rateLocked = true;
  setTimeout(() => { rateLocked = false; }, 3000);

  // Clear input
  inp.value = ''; inp.style.height = 'auto';
  const imgSnap = pendingImg ? { ...pendingImg } : null;
  if (pendingImg) removeImg();

  // Render user message
  const displayText = text || '(Ảnh đính kèm)';
  appendUserMsg(displayText, imgSnap?.dataUrl);

  // Build current parts
  const parts = [];
  if (text) parts.push({ text });
  if (imgSnap) {
    parts.push({ inlineData: { mimeType: imgSnap.mimeType, data: imgSnap.base64 } });
    if (!text) parts.push({ text: 'Hãy phân tích ảnh này và giải thích chi tiết.' });
  }

  // Add to history
  chatHistory.push({ role: 'user', parts });

  // Loading
  isLoading = true;
  setSend(false);
  const loader = appendLoader();

  try {
    // Build system instruction
    const sysContent = buildSystemPrompt(cfg);

    // Trim history to last 20 turns
    const trimmed = chatHistory.slice(-20);

    const body = {
      system_instruction: sysContent ? { parts: [{ text: sysContent }] } : undefined,
      contents: trimmed,
      generationConfig: { temperature: 0.65, maxOutputTokens: 2048 }
    };

    const model = cfg.model || 'gemini-1.5-flash';
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cfg.apiKey}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
    );

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `Lỗi HTTP ${res.status}`);
    }

    const data = await res.json();
    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Xin lỗi, tôi không thể xử lý yêu cầu này.';

    loader.remove();
    appendAIMsg(aiText);

    // Add to history
    chatHistory.push({ role: 'model', parts: [{ text: aiText }] });

  } catch (err) {
    loader.remove();
    appendError(`❌ ${err.message}`);
    // Remove last user message from history on error
    chatHistory.pop();
  } finally {
    isLoading = false;
    setSend(true);
  }
}

// ══════════════════════════════════════
// SYSTEM PROMPT BUILDER
// ══════════════════════════════════════
function buildSystemPrompt(cfg) {
  const parts = [];

  // Brain file (PDF or text)
  if (cfg.brainText) parts.push('=== QUY TẮC VÀ VAI TRÒ ===\n' + cfg.brainText);
  else if (cfg.brainPdf) {
    // PDF base64 — will be sent as document part separately if needed
    // For now add a note; PDF content referenced via inlineData in a separate approach
    parts.push('Bạn là Trợ lý AI học tập chuyên về XNK & Logistics của Street 2 Hand.');
  }

  // Doc file (text)
  if (cfg.docText) parts.push('=== TÀI LIỆU THAM CHIẾU ===\n' + cfg.docText);

  // Default fallback
  if (parts.length === 0) {
    parts.push(`Bạn là Trợ lý AI học tập của Street 2 Hand, chuyên về Xuất Nhập Khẩu (XNK) và Logistics. 
Trả lời bằng tiếng Việt, thân thiện, chuyên nghiệp. 
Hỗ trợ học viên về: Incoterms 2020, thông quan hải quan, chứng từ XNK, L/C, HS Code, vận tải quốc tế.
Nếu học viên gửi ảnh tờ khai hoặc bài tập, hãy phân tích chi tiết.`);
  }

  return parts.join('\n\n');
}

// ══════════════════════════════════════
// RENDER HELPERS
// ══════════════════════════════════════
function appendUserMsg(text, imgDataUrl) {
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-user-wrap fade-up';
  let inner = '';
  if (imgDataUrl) {
    inner += `<div style="display:flex;justify-content:flex-end;margin-bottom:6px;">
      <img src="${escAttr(imgDataUrl)}" style="max-width:220px;max-height:160px;border-radius:12px;object-fit:contain;border:1px solid #E5E7EB;">
    </div>`;
  }
  if (text && text !== '(Ảnh đính kèm)') {
    inner += `<div class="msg-user-wrap"><div class="msg-user">${escHtml(text)}</div></div>`;
  }
  wrap.innerHTML = inner || `<div class="msg-user-wrap"><div class="msg-user">(Ảnh đính kèm)</div></div>`;
  box.appendChild(wrap);
  scroll();
}

function appendLoader() {
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-ai-wrap fade-up';
  wrap.id = 'loader';
  wrap.innerHTML = `
    <div class="ai-avatar">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 1h10l2 2v8l-2 2H2L0 11V3L2 1Z" stroke="white" stroke-width="0.8" fill="rgba(255,255,255,0.2)"/></svg>
    </div>
    <div style="padding:10px 0;display:flex;align-items:center;gap:5px;">
      <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
    </div>`;
  box.appendChild(wrap);
  scroll();
  return wrap;
}

function appendAIMsg(text) {
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-ai-wrap fade-up';
  wrap.innerHTML = `
    <div class="ai-avatar">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 1h10l2 2v8l-2 2H2L0 11V3L2 1Z" stroke="white" stroke-width="0.8" fill="rgba(255,255,255,0.2)"/></svg>
    </div>
    <div class="msg-ai">${mdToHtml(text)}</div>`;
  box.appendChild(wrap);
  scroll();
}

function appendError(msg) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg-error fade-up';
  div.textContent = msg + ' — Vui lòng kiểm tra API Key trong Admin Panel.';
  box.appendChild(div);
  scroll();
}

function scroll() {
  const box = document.getElementById('messages');
  setTimeout(() => box.scrollTop = box.scrollHeight, 50);
}

function setSend(enabled) {
  const btn = document.getElementById('send-btn');
  btn.disabled = !enabled;
  btn.style.background = enabled ? '#111' : '#E5E7EB';
}

// ══════════════════════════════════════
// MARKDOWN → HTML
// ══════════════════════════════════════
function mdToHtml(t) {
  if (!t) return '';
  let h = escHtml(t);
  h = h.replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  h = h.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  h = h.replace(/^\s*[\*\-] (.+)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>)(?![\s\S]*<li>)/g, '<ul>$&</ul>');
  h = h.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  h = h.replace(/\|(.+)\|\n\|[-|: ]+\|\n((?:\|.+\|\n?)+)/g, (m, hdr, rows) => {
    const ths = hdr.split('|').filter(s=>s.trim()).map(s=>`<th>${s.trim()}</th>`).join('');
    const trs = rows.trim().split('\n').map(r=>'<tr>'+r.split('|').filter(s=>s.trim()).map(s=>`<td>${s.trim()}</td>`).join('')+'</tr>').join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  });
  h = h.replace(/\n\n+/g, '</p><p>');
  h = h.replace(/\n/g, '<br>');
  h = `<p>${h}</p>`;
  h = h.replace(/<p>(<[hupb])/g, '$1').replace(/(<\/[hupb][^>]*>)<\/p>/g, '$1').replace(/<p><\/p>/g, '');
  return h;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return String(s).replace(/"/g,'&quot;'); }
</script>
</body>
</html>
